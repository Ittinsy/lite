name: Build Linux (unpacked)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (linux-unpacked)
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Pack
        run: tar -czf lite-linux-x64.tar.gz -C dist linux-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: lite-linux-x64
          path: lite-linux-x64.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lite-linux-x64.tar.gz
