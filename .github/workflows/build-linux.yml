name: Build Linux (unpacked)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (linux-unpacked)
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Pack
        run: |
          mv dist/linux-unpacked dist/lite
          tar -cJf lite-linux-x64.tar.xz -C dist lite

      - uses: actions/upload-artifact@v4
        with:
          name: lite-linux-x64
          path: lite-linux-x64.tar.xz
          compression-level: 0
